seed: 42

model:
  base_name: "Qwen/Qwen2.5-1.5B-Instruct"
  max_length: 512
  use_4bit: false
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05

data:
  preference_dataset: "Anthropic/hh-rlhf"
  preference_split: "train"
  max_preference_samples: 3000
  processed_preferences: "data/processed/preferences.jsonl"
  ethics_dataset: "hendrycks/ethics"
  ethics_subset: "commonsense"
  ethics_split: "test"
  max_eval_samples: 300

training:
  output_dir: "models"
  reward_model_dir: "models/reward_model"
  aligned_model_dir: "models/rlhf_aligned"
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  num_train_epochs: 3
  logging_steps: 10
  save_steps: 200
  max_grad_norm: 1.0

ppo:
  steps: 200
  batch_size: 2
  mini_batch_size: 2
  learning_rate: 0.000005
  target_kl: 0.1

evaluation:
  results_dir: "reports"
  answer_labels:
    ethical: "acceptable"
    unethical: "unacceptable"
